<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-RENTALS - Product Details</title>
    <style>
        /* Ensure the root and body allow scrolling */
        html, body {
            height: auto !important;
            min-height: 100% !important;
            overflow-y: auto !important;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .content-wrapper, .main-container {
            height: auto !important;
            min-height: 100vh;
            display: block; /* Ensure it's not trapped by a flexbox parent */
            overflow: visible !important;
        }
        #dynamic-results-list {
            height: auto !important;
            overflow: visible !important;
        }

        /* Ensure your content wrapper doesn't trap the height */
        .main-container {
            min-height: 100vh;
            padding-bottom: 50px; /* Space at the bottom */
        }

        /* Optional: Add a smooth scroll effect */
        html {
            scroll-behavior: smooth;
        }
        :root {
            --nav-border: #e0e0e0;
            --bg-gray: #f5f5f5;
            --label-bg: #eeeeee;
            --accent-red: #ff4d4d;
            --btn-gray: #d9d9d9;
            --btn-white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #ffffff; /* Darker overlay background from screenshot */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .nav-links li.active { font-weight: 600; }
        .nav-links a {
            text-decoration: none;
            color: #333;
        }
        
        /* --- Sticky Navigation --- */
        nav {
            display: flex;
            align-items: center;
            padding: 10px 40px;
            background-color: white;
            border-bottom: 1px solid var(--nav-border);
            height: 60px;
            flex-shrink: 0;
        }
        .logo { height: 40px; margin-right: 50px; }
        .nav-links { display: flex; list-style: none; margin: 0; padding: 0; flex-grow: 1; gap: 40px; }
        .nav-links li { font-size: 18px; cursor: pointer; color: #333; }
        
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .profile-icon { width: 35px; height: 35px; background: #eee; border-radius: 50%; border: 1px solid #ddd; }

        /* --- Scrollable Content Area --- */
        .main-container {
            flex-grow: 1;
            overflow-y: auto; /* Enables scrolling for the list */
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* --- Top Controls (Back & Cart) --- */
        .top-controls {
            width: 90%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cart-box { text-align: center; }
        .cart-icon {
            background: #d9d9d9;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* --- Product Card --- */
        .product-card {
            background: white;
            width: 90%;
            max-width: 950px;
            border-radius: 20px;
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .card-body { display: flex; gap: 30px; }

        /* Left side image and labels */
        .image-container { position: relative; width: 300px; }
        .labels { display: flex; gap: 10px; position: absolute; top: -10px; left: 0; }
        .label { background: var(--label-bg); padding: 4px 15px; border-radius: 4px; font-size: 14px; }
        .product-img { width: 100%; height: auto; margin-top: 30px; }

        /* Right side details */
        .details { flex-grow: 1; }
        .title-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 15px; }
        .product-title { font-size: 28px; font-weight: 500; margin: 0; }
        .stock-info { width: 300px; text-align: left; }
        .stock-bar { width: 100%; height: 20px; background: #eee; border-radius: 10px; position: relative; overflow: hidden; }
        .stock-bar-fill {
            white-space: nowrap; /* Prevents text from wrapping */
            min-width: fit-content; /* Ensures the bar is at least as wide as the text */
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-red);
        }
        .detail-text { color: #555; line-height: 1.5; margin: 20px 0; font-size: 15px; }
        .specs-toggle { font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* Footer Row */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
        }
        .due-date { font-size: 16px; color: #333; }
        .action-group { display: flex; align-items: center; gap: 15px; }

        .qty-picker { display: flex; border: 1px solid #ddd; border-radius: 4px; align-items: center; }
        .qty-btn { width: 35px; height: 35px; border: none; background: white; cursor: pointer; font-size: 18px; color: #ccc; }
        .qty-val { width: 50px; text-align: center; border-left: 1px solid #ddd; border-right: 1px solid #ddd; }

        .btn { padding: 12px 30px; border-radius: 6px; border: none; font-size: 16px; cursor: pointer; font-weight: 500; }
        .btn-add { background: var(--btn-gray); }
        .btn-rent { background: var(--btn-gray); }
        /* GEMINI HELPER */
        .gemini-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
            z-index: 1000;
            transition: transform 0.2s;
        }

        .gemini-btn:hover {
            transform: scale(1.05);
        }

        .gemini-icon {
            margin-right: 8px;
            font-size: 18px;
        }
        .ai-modal {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            z-index: 1001;
        }

        .ai-header {
            background: #1a3a8a; /* Matches your logo blue */
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .ai-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .ai-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
        }

        #ai-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .ai-footer button {
            background: #7d97e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        /* GEMINI HELPER */        
    </style>
</head>
<body>

    <nav>
        <img src="https://i.postimg.cc/N0Y1nx0g/mu-ict-logo.png" alt="Logo" class="logo">
        <ul class="nav-links">
            <li><a href="/student/dashboard">Dashboard</a></li>
            <li><a href="/student/search">Search</a></li>
            <li><a href="/student/rent">Rent</a></li>
            <li><a href="/student/team">Team Page</a></li>
        </ul>
        <div class="nav-right">
            <img src="https://i.postimg.cc/sgJMCVtT/Doorbell.png" style="height: 25px; cursor: pointer; margin-left: 15px;">
            
            <div class="profile-nav-wrapper" style="position: relative; display: flex; align-items: center; margin-left: 15px;">
                
                <div style="width: 35px; height: 35px; background-color: #e0e0e0; border-radius: 50%; border: 1px solid #ccc; overflow: hidden; display: flex; align-items: flex-end; justify-content: center;">
                    <img src="https://i.postimg.cc/wjsC2LfL/Male-User.png" style="width: 35px; height: 30px">
                </div>
                <span class="dropdown-arrow" onclick="toggleDropdown()" style="cursor: pointer; margin-left: 8px; color: #666; font-size: 12px; transition: 0.2s;">▼</span>

                <div id="profile-dropdown" style="display: none; position: absolute; top: 45px; right: 0; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 1000; min-width: 140px; padding: 5px 0;">
                    <a href="/student/profile" style="display: block; padding: 10px 20px; color: #333; text-decoration: none; font-size: 14px; transition: background 0.2s;">Profile</a>
                    <a href="/" style="display: block; padding: 10px 20px; color: #d9534f; text-decoration: none; font-size: 14px; transition: background 0.2s; border-top: 1px solid #eee;">Log Out</a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <div class="main-container">
            <div id="dynamic-results-list">
                <div style="text-align: center; padding: 40px;">Searching for equipment...</div>
            </div>
        </div>
    </main>

    <!-- GEMINI HELPER -->
    <footer>
        <button class="gemini-btn" onclick="toggleAI()">
            <span class="gemini-icon">✨</span> Ask Gemini
        </button>

        <div id="ai-window" class="ai-modal" style="display: none;">
            <div class="ai-header">
                <span>✨ Gemini Assistant</span>
                <button onclick="toggleAI()" class="close-btn">&times;</button>
            </div>
            <div id="ai-response-area" class="ai-content">
                Hi! How can I help you navigate ICT-RENTALS?
            </div>
            <div class="ai-footer">
                <input type="text" id="ai-input" placeholder="Type your question...">
                <button onclick="sendToAI()">Send</button>
            </div>
        </div>
    </footer>


    <script>
        function toggleAI() {
            const win = document.getElementById('ai-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const prompt = input.value;
            if (!prompt) return;

            area.innerHTML = "<em>Thinking...</em>";
            input.value = ""; // Clear input

            try {
                const response = await fetch('/api/ai-assist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[Context: ${window.location.pathname}] ${prompt}` }),
                });
                
                const data = await response.json();
                area.innerHTML = data.success ? data.text : "Error: " + data.error;
            } catch (err) {
                area.innerHTML = "Failed to connect to AI.";
            }
        }
        function toggleDropdown() {
            const dropdown = document.getElementById('profile-dropdown');
            const arrow = document.querySelector('.dropdown-arrow');
            
            if (dropdown.style.display === 'none') {
                dropdown.style.display = 'block';
                arrow.textContent = '▲';
            } else {
                dropdown.style.display = 'none';
                arrow.textContent = '▼';
            }
        }

        // Close dropdown if user clicks anywhere else on the screen
        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-arrow')) {
                const dropdown = document.getElementById('profile-dropdown');
                const arrow = document.querySelector('.dropdown-arrow');
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                    arrow.textContent = '▼';
                }
            }
        }

        // Search result
        document.addEventListener('DOMContentLoaded', async () => {
            const resultsContainer = document.getElementById('dynamic-results-list');
            const urlParams = new URLSearchParams(window.location.search);

            try {
                const response = await fetch(`/api/student/search?${urlParams.toString()}`);
                const result = await response.json();

                if (result.error || result.data.length === 0) {
                    resultsContainer.innerHTML = `<div style="text-align: center; padding: 40px;">No matching equipment found.</div>`;
                    return;
                }

                resultsContainer.innerHTML = result.data.map(product => {
                    const available = product.quantity_available || 0;
                    const total = product.quantity_total || 0;
                    const stockPercent = total > 0 ? (available / total) * 100 : 0;
                    
                    // Stock logic: Start at 0 if no stock
                    const isOutOfStock = available <= 0;
                    const initialQty = isOutOfStock ? 0 : 1;
                    const disabledStyle = isOutOfStock ? 'opacity: 0.5; pointer-events: none; cursor: not-allowed;' : '';

                    return `
                    <div class="product-card" style="margin-bottom: 20px;">
                        <div class="card-body">
                            <div class="image-container">
                                <div class="labels">
                                    <span class="label">${product.category}</span>
                                    <span class="label">${product.brand}</span>
                                </div>
                                <img src="${product.img_url}" alt="${product.name}" class="product-img">
                            </div>
                            
                            <div class="details">
                                <div class="title-row">
                                    <h2 class="product-title">${product.name}</h2>
                                    <div class="stock-info">
                                        <span style="font-size: 14px;">left in stock</span>
                                        <div class="stock-bar" style="position: relative; width: 100%; background: #eee; height: 24px; border-radius: 12px; overflow: hidden; display: flex; align-items: center;">
                                            <div style="position: absolute; left: 0; top: 0; height: 100%; width: ${stockPercent}%; background: #ffebeb; transition: width 0.3s ease;"></div>
                                            
                                            <div style="position: relative; width: 100%; text-align: center; color: #ff4d4f; font-size: 13px; font-weight: 600; z-index: 1; white-space: nowrap;">
                                                ${available} out of ${total}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="detail-text">
                                    <strong>Detail</strong><br>
                                    ${product.details}
                                </div>
                                
                                <div class="specs-wrapper" style="margin-top: 10px;">
                                    <div class="specs-toggle" onclick="toggleSpecs(this)" style="cursor: pointer; color: #555; font-weight: 500;">
                                        ▼ Specifications
                                    </div>
                                    <div class="specs-content" style="display: none; padding: 10px; background: #f9f9f9; border-radius: 4px; margin-top: 5px; font-size: 13px; border-left: 3px solid #007bff;">
                                        ${product.specs}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer">
                            <div class="due-date">Due date: 22/02/2026</div>
                            <div class="action-group">
                                <span style="margin-right: 10px;">Quantity</span>
                                <div class="qty-picker" data-max-stock="${available}" style="display: flex; align-items: center; border: 1px solid #ddd; border-radius: 4px; background: #fff; ${disabledStyle}">
                                    <button class="qty-btn" onclick="adjustQty(this, -1)" style="padding: 5px 12px; border: none; cursor: pointer;">−</button>
                                    <div class="qty-val" style="padding: 0 15px; font-weight: 600; min-width: 20px; text-align: center;">${initialQty}</div>
                                    <button class="qty-btn" onclick="adjustQty(this, 1)" style="padding: 5px 12px; border: none; cursor: pointer;">+</button>
                                </div>
                                <button class="btn btn-add" style="${disabledStyle}" onclick="addToCart('${product.model_id}', this)">
                                    ${isOutOfStock ? 'Out of Stock' : 'Add to cart'}
                                </button>
                                <button class="btn btn-rent" style="${disabledStyle}" onclick="rentNow('${product.model_id}', this)">Rent now</button>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');

                // Ensure the page allows scrolling after injection
                document.documentElement.style.height = 'auto';
                document.body.style.overflowY = 'auto';

            } catch (error) {
                console.error("Search failed:", error);
                resultsContainer.innerHTML = `<div style="text-align: center; color: red;">Error connecting to server.</div>`;
            }
        });

        function adjustQty(btn, change) {
            const picker = btn.parentElement;
            const qtyDisplay = picker.querySelector('.qty-val');
            const maxStock = parseInt(picker.getAttribute('data-max-stock')) || 0;
            
            let currentQty = parseInt(qtyDisplay.innerText);
            let newQty = currentQty + change;

            if (newQty < 0) newQty = 0;
            if (newQty > maxStock) newQty = maxStock;

            qtyDisplay.innerText = newQty;
        }

        function toggleSpecs(element) {
            const content = element.nextElementSibling;
            if (content.style.display === "none") {
                content.style.display = "block";
                element.innerText = "▲ Specifications";
            } else {
                content.style.display = "none";
                element.innerText = "▼ Specifications";
            }
        }
        // --- Cart Management Logic ---

        function addToCart(modelId, btnElement) {
            const card = btnElement.closest('.product-card');
            const quantityToAdd = parseInt(card.querySelector('.qty-val').innerText);
            const productName = card.querySelector('.product-title').innerText;
            
            // 1. Get max stock
            const picker = card.querySelector('.qty-picker');
            const maxStock = parseInt(picker.getAttribute('data-max-stock')) || 0;

            if (quantityToAdd <= 0) return;

            // 2. Retrieve existing cart
            let cart = JSON.parse(localStorage.getItem('student_cart')) || [];

            // 3. Check current total for this item in the cart
            const existingItem = cart.find(item => item.model_id === modelId);
            const currentInCart = existingItem ? existingItem.quantity : 0;

            // 4. VALIDATION: Prevent exceeding stock
            if (currentInCart + quantityToAdd > maxStock) {
                alert(`❌ Cannot add more. Only ${maxStock} units available in total, and you already have ${currentInCart} in your cart.`);
                return; 
            }

            // 5. Update or Add to cart
            if (existingItem) {
                existingItem.quantity += quantityToAdd;
            } else {
                cart.push({
                    model_id: modelId,
                    name: productName,
                    quantity: quantityToAdd,
                    img: card.querySelector('.product-img').src
                });
            }

            // 6. Save back to localStorage
            localStorage.setItem('student_cart', JSON.stringify(cart));
            
            // 7. FEEDBACK: Update the UI without reloading
            updateCartCounter(); 
            
            // Optional: Change button text temporarily for feedback
            const originalText = btnElement.innerText;
            btnElement.innerText = "✅ Added!";
            btnElement.style.background = "#4CAF50"; // Green feedback
            btnElement.style.color = "white";

            setTimeout(() => {
                btnElement.innerText = originalText;
                btnElement.style.background = ""; // Back to CSS default
                btnElement.style.color = "";
            }, 2000);
        }

        function rentNow(modelId, btnElement) {
            // Clear previous "Instant Rent" selection and save current one
            const card = btnElement.closest('.product-card');
            const quantity = card.querySelector('.qty-val').innerText;
            
            const checkoutItem = {
                model_id: modelId,
                quantity: quantity
            };
            
            localStorage.setItem('direct_rent', JSON.stringify(checkoutItem));
            
            // Redirect straight to justification page
            window.location.href = '/student/cart';
        }

        function updateCartCounter() {
            const cart = JSON.parse(localStorage.getItem('student_cart')) || [];
            const counter = document.getElementById('cart-count');
            if (counter) {
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                counter.innerText = `In cart: ${totalItems}`;
            }
        }
    </script>
</body>
</html>
