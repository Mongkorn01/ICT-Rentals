<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ==================== META & PAGE SETUP ==================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-RENTALS - iPhone 13 Detail</title>

    <style>
        /* ==================== ROOT VARIABLES ==================== */
        :root {
            --nav-border: #e0e0e0;
            --bg-light: #f9f9f9;
            --label-bg: #eeeeee;
            --accent-red: #ff4d4d;
            --btn-gray: #e0e0e0;
            --text-main: #333;
            --text-muted: #666;
        }

        /* ==================== BASE LAYOUT ==================== */
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ==================== NAVIGATION BAR ==================== */
        nav {
            display: flex;
            align-items: center;
            padding: 0 40px;
            background-color: white;
            border-bottom: 1px solid var(--nav-border);
            height: 70px;
            flex-shrink: 0;
        }
        .logo { height: 45px; margin-right: 50px; }
        .nav-links { display: flex; list-style: none; margin: 0; padding: 0; flex-grow: 1; gap: 45px; }
        .nav-links li { font-size: 18px; cursor: pointer; color: #333; }
        .nav-links li.active { font-weight: 600; }
        
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .profile-section { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .profile-icon { width: 40px; height: 40px; background: #eee; border-radius: 50%; border: 1px solid #ddd; }

        .nav-links a {
            text-decoration: none;
            color: #333;
        }

        /* ==================== MAIN CONTENT LAYOUT ==================== */
        .content-wrapper {
            flex-grow: 1;
            padding: 20px 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .top-action-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-circle {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            font-size: 20px;
            color: #ccc;
        }

        /* ==================== CART STATUS ==================== */
        .cart-status { text-align: center; }
        .cart-icon-circle {
            width: 50px;
            height: 50px;
            background: #d9d9d9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 4px;
        }

        /* ==================== PRODUCT CARD ==================== */
        .product-card {
            background: white;
            width: 100%;
            max-width: 1000px;
            border-radius: 20px;
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .product-main { display: flex; gap: 40px; }

        /* --- LEFT: PRODUCT VISUALS --- */
        .product-visuals { width: 320px; position: relative; }
        .tag-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .tag { background: var(--label-bg); padding: 5px 18px; border-radius: 4px; font-size: 14px; font-weight: 500; }
        .product-image { width: 100%; height: auto; object-fit: contain; }

        /* --- RIGHT: PRODUCT INFO --- */
        .product-info { flex-grow: 1; }
        .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .product-title { font-size: 32px; font-weight: 500; margin: 0; }
        
        /* --- STOCK BAR --- */
        .stock-container { width: 280px; }
        .stock-label { font-size: 14px; margin-bottom: 5px; display: block; }
        .stock-bar-bg { width: 100%; height: 24px; background: #f0f0f0; border-radius: 12px; overflow: hidden; }
        .stock-bar-fill {
            white-space: nowrap;
            min-width: fit-content;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-red);
        }

        /* --- DESCRIPTION & SPECS --- */
        .description-box { margin: 25px 0; line-height: 1.6; }
        .description-title { font-weight: bold; font-size: 16px; display: block; margin-bottom: 8px; }
        .description-content { color: var(--text-muted); font-size: 15px; }

        .specs-toggle { color: #333; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }

        /* ==================== FOOTER ACTIONS ==================== */
        .card-footer {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .due-date { font-size: 17px; font-weight: 500; }
        
        .interaction-group { display: flex; align-items: center; gap: 20px; }
        .qty-label { font-size: 16px; }
        .qty-selector { display: flex; border: 1px solid #ddd; border-radius: 5px; overflow: hidden; }
        .qty-btn { width: 40px; height: 40px; border: none; background: white; font-size: 20px; cursor: pointer; color: #ccc; }
        .qty-input { width: 50px; text-align: center; border-left: 1px solid #ddd; border-right: 1px solid #ddd; line-height: 40px; font-size: 16px; }

        .btn { padding: 12px 35px; border-radius: 8px; border: none; font-size: 16px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; }
        .btn-cart { background: var(--btn-gray); color: #333; }
        .btn-rent { background: var(--btn-gray); color: #333; }
        .btn:hover { opacity: 0.8; }

        /* ==================== GEMINI HELPER ==================== */
        .gemini-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
            z-index: 1000;
            transition: transform 0.2s;
        }

        .gemini-btn:hover { transform: scale(1.05); }

        .gemini-icon { margin-right: 8px; font-size: 18px; }

        .ai-modal {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            z-index: 1001;
        }

        .ai-header {
            background: #1a3a8a;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .ai-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .ai-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
        }

        #ai-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .ai-footer button {
            background: #7d97e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- ==================== NAVBAR ==================== -->
    <nav>
        <img src="https://i.postimg.cc/N0Y1nx0g/mu-ict-logo.png" alt="Logo" class="logo">
        <ul class="nav-links">
            <li><a href="/student/dashboard">Dashboard</a></li>
            <li><a href="/student/search">Search</a></li>
            <li><a href="/student/rent">Rent</a></li>
            <li><a href="/student/team">Team Page</a></li>
        </ul>

        <!-- ==================== PROFILE DROPDOWN ==================== -->
        <div class="nav-right">
            <img src="https://i.postimg.cc/sgJMCVtT/Doorbell.png" style="height: 25px; cursor: pointer; margin-left: 15px;">
            
            <div class="profile-nav-wrapper" style="position: relative; display: flex; align-items: center; margin-left: 15px;">
                <div style="width: 35px; height: 35px; background-color: #e0e0e0; border-radius: 50%; border: 1px solid #ccc; overflow: hidden; display: flex; align-items: flex-end; justify-content: center;">
                    <img src="https://i.postimg.cc/wjsC2LfL/Male-User.png" style="width: 35px; height: 30px">
                </div>
                
                <span class="dropdown-arrow" onclick="toggleDropdown()" style="cursor: pointer; margin-left: 8px; color: #666; font-size: 12px;">▼</span>

                <div id="profile-dropdown" style="display: none; position: absolute; top: 45px; right: 0; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 1000; min-width: 140px; padding: 5px 0;">
                    <a href="/student/profile" style="display: block; padding: 10px 20px; color: #333; text-decoration: none;">Profile</a>
                    <a href="/" style="display: block; padding: 10px 20px; color: #d9534f; text-decoration: none; border-top: 1px solid #eee;">Log Out</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="content-wrapper">
        <div class="top-action-bar">
            <div class="back-circle" onclick="history.back()">⟨</div>

            <div class="cart-status" onclick="location.href='/student/cart'">
                <div class="cart-icon-circle">🛒</div>
                <div id="cart-count">In cart: 0</div>
            </div>
        </div>

        <!-- ==================== PRODUCT DISPLAY ==================== -->
        <div class="product-card">
            <div class="product-main">

                <!-- LEFT: IMAGE + TAGS -->
                <div class="product-visuals">
                    <div class="tag-row">
                        <span class="tag" id="display-category">Category</span>
                        <span class="tag" id="display-brand">Brand</span>
                    </div>
                    <img src="" alt="" id="display-img" class="product-image">
                </div>

                <!-- RIGHT: PRODUCT INFO -->
                <div class="product-info">
                    <div class="header-row">
                        <h1 class="product-title" id="display-name">Loading...</h1>

                        <!-- STOCK BAR -->
                        <div class="stock-container">
                            <span class="stock-label">left in stock</span>
                            <div class="stock-bar-bg">
                                <div id="display-stock-bar" class="stock-bar-fill">0 out of 0</div>
                            </div>
                        </div>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="description-box">
                        <span class="description-title">Detail</span>
                        <p class="description-content" id="display-details">Fetching details...</p>
                    </div>

                    <!-- SPECIFICATIONS -->
                    <div class="specs-toggle" onclick="toggleSpecs()">▼ Specifications</div>
                    <div id="display-specs" style="display: none; padding: 10px;"></div>
                </div>
            </div>

            <!-- ==================== ACTION FOOTER ==================== -->
            <div class="card-footer">
                <div class="due-date">Due date: 22/02/2026</div>

                <div class="interaction-group">
                    <span class="qty-label">Quantity</span>

                    <div class="qty-selector">
                        <button class="qty-btn" onclick="changeQty(-1)">−</button>
                        <div class="qty-input" id="qty-val">1</div>
                        <button class="qty-btn" onclick="changeQty(1)">+</button>
                    </div>

                    <button class="btn btn-cart" id="add-btn">Add to cart</button>
                    <button class="btn btn-rent" id="rent-btn">Rent now</button>  
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== GEMINI HELPER UI ==================== -->
    <footer>
        <button class="gemini-btn" onclick="toggleAI()">
            <span class="gemini-icon">✨</span> Ask Gemini
        </button>

        <div id="ai-window" class="ai-modal" style="display: none;">
            <div class="ai-header">
                <span>✨ Gemini Assistant</span>
                <button onclick="toggleAI()" class="close-btn">&times;</button>
            </div>
            <div id="ai-response-area" class="ai-content">
                Hi! How can I help you navigate ICT-RENTALS?
            </div>
            <div class="ai-footer">
                <input type="text" id="ai-input" placeholder="Type your question...">
                <button onclick="sendToAI()">Send</button>
            </div>
        </div>
    </footer>

    <!-- ==================== SCRIPT SECTION ==================== -->
    <script>
        /* --- GEMINI HELPER LOGIC --- */
        function toggleAI() {
            const win = document.getElementById('ai-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const prompt = input.value;
            if (!prompt) return;

            area.innerHTML = "<em>Thinking...</em>";
            input.value = "";

            try {
                const response = await fetch('/api/ai-assist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[Context: ${window.location.pathname}] ${prompt}` }),
                });
                
                const data = await response.json();
                area.innerHTML = data.success ? data.text : "Error: " + data.error;
            } catch (err) {
                area.innerHTML = "Failed to connect to AI.";
            }
        }

        /* --- PROFILE DROPDOWN LOGIC --- */
        function toggleDropdown() {
            const dropdown = document.getElementById('profile-dropdown');
            const arrow = document.querySelector('.dropdown-arrow');
            
            if (dropdown.style.display === 'none') {
                dropdown.style.display = 'block';
                arrow.textContent = '▲';
            } else {
                dropdown.style.display = 'none';
                arrow.textContent = '▼';
            }
        }

        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-arrow')) {
                const dropdown = document.getElementById('profile-dropdown');
                const arrow = document.querySelector('.dropdown-arrow');
                if (dropdown.style.display === 'block') {
                    dropdown.style.display = 'none';
                    arrow.textContent = '▼';
                }
            }
        }

        /* --- PRODUCT DATA FETCHING --- */
        let maxAvailable = 0; 

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                alert("No product ID provided");
                return;
            }

            try {
                const response = await fetch(`/api/student/product/${productId}`);
                const result = await response.json();

                if (result.error) {
                    document.getElementById('display-name').innerText = "Product Not Found";
                    return;
                }

                const product = result.data;

                maxAvailable = product.quantity_available || 0;
                const total = product.quantity_total || 0;
                const stockPercent = total > 0 ? (maxAvailable / total) * 100 : 0;
                const isOutOfStock = maxAvailable <= 0;

                document.getElementById('display-name').innerText = product.name;
                document.getElementById('display-category').innerText = product.category;
                document.getElementById('display-brand').innerText = product.brand;
                document.getElementById('display-details').innerText = product.details;
                document.getElementById('display-specs').innerText = product.specs;
                
                const img = document.getElementById('display-img');
                img.src = product.img_url;
                img.alt = product.name;

                const barContainer = document.getElementById('display-stock-bar').parentElement;
                barContainer.innerHTML = `
                    <div class="stock-bar" style="position: relative; width: 100%; height: 24px;">
                        <div style="position: absolute; width: ${stockPercent}%; background: #ffebeb; height: 100%;"></div>
                        <div style="position: relative; text-align: center; z-index: 1;">
                            ${maxAvailable} out of ${total}
                        </div>
                    </div>
                `;

                const addBtn = document.getElementById('add-btn');
                const rentBtn = document.getElementById('rent-btn');
                const qtyDisplay = document.getElementById('qty-val');

                if (isOutOfStock) {
                    addBtn.disabled = true;
                    rentBtn.disabled = true;
                    addBtn.innerText = "Out of Stock";
                    qtyDisplay.innerText = "0";
                }

                addBtn.onclick = (e) => addToCart(product.model_id, e.target);

                rentBtn.onclick = () => {
                    const currentQty = parseInt(qtyDisplay.innerText);
                    if (currentQty > 0) {
                        localStorage.setItem('direct_rent', JSON.stringify({
                            model_id: product.model_id,
                            name: product.name,
                            quantity: currentQty
                        }));
                        window.location.href = '/student/cart';
                    }
                };

                updateCartCount();

            } catch (err) {
                console.error("Error loading product:", err);
            }
        });

        /* --- UI INTERACTIONS --- */
        function toggleSpecs() {
            const specs = document.getElementById('display-specs');
            specs.style.display = specs.style.display === 'none' ? 'block' : 'none';
        }

        function changeQty(val) {
            const qtyElem = document.getElementById('qty-val');
            let current = parseInt(qtyElem.innerText);

            if (maxAvailable <= 0) return;

            let nextValue = current + val;
            if (nextValue < 1) nextValue = 1;
            if (nextValue > maxAvailable) nextValue = maxAvailable;

            qtyElem.innerText = nextValue;
        }

        /* --- CART LOGIC --- */
        function addToCart(modelId, btnElement) {
            const qtyElem = document.getElementById('qty-val');
            const quantityToAdd = parseInt(qtyElem.innerText);
            const productName = document.getElementById('display-name').innerText;
            const productImg = document.getElementById('display-img').src;

            if (quantityToAdd <= 0) return;

            let cart = JSON.parse(localStorage.getItem('student_cart')) || [];
            const existingItem = cart.find(item => item.model_id === modelId);
            const currentInCart = existingItem ? existingItem.quantity : 0;

            if (currentInCart + quantityToAdd > maxAvailable) {
                alert(`❌ Cannot add more. Only ${maxAvailable} available.`);
                return; 
            }

            if (existingItem) {
                existingItem.quantity += quantityToAdd;
            } else {
                cart.push({ model_id: modelId, name: productName, quantity: quantityToAdd, img: productImg });
            }

            localStorage.setItem('student_cart', JSON.stringify(cart));
            updateCartCount();

            const originalText = btnElement.innerText;
            btnElement.innerText = "✅ Added!";
            setTimeout(() => btnElement.innerText = originalText, 2000);
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('student_cart')) || [];
            const totalQty = cart.reduce((total, item) => total + item.quantity, 0);
            const counterDisplay = document.getElementById('cart-count');
            if (counterDisplay) counterDisplay.innerText = `In cart: ${totalQty}`;
        }
    </script>
</body>
</html>
