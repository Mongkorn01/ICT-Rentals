<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-RENTALS Product List</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        /* --- Navbar (Consistent with previous screens) --- */
        .nav-links li.active { font-weight: 600; }
        .nav-links a {
            text-decoration: none;
            color: #333;
        }

        nav {
            display: flex;
            align-items: center;
            padding: 10px 40px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #fcfcfc;
        }

        .logo { height: 45px; margin-right: 40px; }

        .nav-links {
            display: flex;
            list-style: none;
            margin: 0; padding: 0;
            flex-grow: 1;
        }

        .nav-links li { margin: 0 20px; font-size: 18px; cursor: pointer; }
        .nav-links li.active { font-weight: 500; background-color: #f8f8f8; padding: 10px 15px; margin: -10px 5px; }
        .dropdown::after {font-size: 10px; color: #888; }
        .nav-links li.active {
            font-weight: 600;
        }        
        .nav-right { display: flex; align-items: center; gap: 20px; }

        /* --- Content Layout --- */
        .container { padding: 40px 5%; max-width: 1400px; margin: 0 auto; }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        h1 { font-size: 28px; margin: 0 0 10px 0; }

        .controls { color: #666; font-size: 18px; }
        
        select {
            padding: 4px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 0 5px;
            font-size: 16px;
        }

        .btn-add {
            background-color: #e0e0e0;
            color: #888;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- Product Table --- */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ddd;
        }

        th {
            background-color: #efefef;
            padding: 15px;
            text-align: center;
            color: #777;
            font-size: 14px;
            border: 1px solid #ddd;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
            color: #555;
            text-align: center;
            vertical-align: middle;
        }

        .text-left { text-align: left; padding-left: 20px; }

        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; /* Use a lighter grey for better contrast */
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        .switch input:checked + .slider {
            background-color: #4CAF50; 
        }

        .switch input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Action Icons */
        .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #999;
            cursor: pointer;
            margin: 0 5px;
        }
    
        /* GEMINI HELPER */
        .gemini-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
            z-index: 1000;
            transition: transform 0.2s;
        }

        .gemini-btn:hover {
            transform: scale(1.05);
        }

        .gemini-icon {
            margin-right: 8px;
            font-size: 18px;
        }
        .ai-modal {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            z-index: 1001;
        }

        .ai-header {
            background: #1a3a8a; /* Matches your logo blue */
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .ai-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .ai-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
        }

        #ai-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .ai-footer button {
            background: #7d97e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        /* GEMINI HELPER */
    </style>
</head>
<body>
    <nav>
        <img src="https://i.postimg.cc/N0Y1nx0g/mu-ict-logo.png" alt="ICT Rentals" class="logo">
        <ul class="nav-links" style="display: flex; align-items: center; list-style: none;">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            
            <li><a href="/admin/product-control">Product Control</a></li>

            <li><a href="/admin/penalty">Penalty Page</a></li>
            <li><a href="/admin/team">Team Page</a></li> 
        </ul>
        <div class="nav-right">
            <a href="/" style="text-decoration: none; color: inherit; cursor: pointer;">Log Out</a>
            <img src="https://i.postimg.cc/sgJMCVtT/Doorbell.png" style="height: 30px; cursor: pointer; margin-left: 15px;">
        </div>
    </nav>

    <main>
        <div class="container">
            <div class="header-row">
                <div>
                    <h1>Product List</h1>
                    <div class="controls">
                        Show 
                        <select id="pageSize">
                            <option value="8">8</option>
                            <option value="16">16</option>
                        </select>
                        Product
                    </div>
                </div>
                <button class="btn-add" onclick="window.location.href='/admin/add-product'">Add product</button> 
            </div>

            <table>
                <thead>
                    <tr>
                        <th width="5%">No.</th>
                        <th width="35%">Product name</th>
                        <th width="12%">Category</th>
                        <th width="10%">Brand</th>
                        <th width="8%">Quantity</th>
                        <th width="10%">Visible</th>
                        <th width="10%">Modify</th>
                        <th width="10%">Delete</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                    </tbody>
            </table>
        </div>
    </main>

    <!-- GEMINI HELPER -->
    <footer>
        <button class="gemini-btn" onclick="toggleAI()">
            <span class="gemini-icon">✨</span> Ask Gemini
        </button>

        <div id="ai-window" class="ai-modal" style="display: none;">
            <div class="ai-header">
                <span>✨ Gemini Assistant</span>
                <button onclick="toggleAI()" class="close-btn">&times;</button>
            </div>
            <div id="ai-response-area" class="ai-content">
                Hi! How can I help you navigate ICT-RENTALS?
            </div>
            <div class="ai-footer">
                <input type="text" id="ai-input" placeholder="Type your question...">
                <button onclick="sendToAI()">Send</button>
            </div>
        </div>
    </footer>


    <script>
        function toggleAI() {
            const win = document.getElementById('ai-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const prompt = input.value;
            if (!prompt) return;

            area.innerHTML = "<em>Thinking...</em>";
            input.value = ""; // Clear input

            try {
                const response = await fetch('/api/ai-assist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[Context: ${window.location.pathname}] ${prompt}` }),
                });
                
                const data = await response.json();
                area.innerHTML = data.success ? data.text : "Error: " + data.error;
            } catch (err) {
                area.innerHTML = "Failed to connect to AI.";
            }
        }

        /*-- API --*/
        document.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });

        // Mock admin ID - Replace this with your actual logged-in admin session data
        const CURRENT_ADMIN_ID = 1; 

        async function fetchProducts() {
            const tableBody = document.getElementById('product-table-body');
            
            try {
                const response = await fetch('/api/admin/product-control');
                const result = await response.json();

                if (result.error) throw new Error(result.message);

                renderProducts(result.data);
            } catch (error) {
                console.error("Fetch Error:", error);
                tableBody.innerHTML = `<tr><td colspan="8" style="color:red; text-align:center;">Error loading products.</td></tr>`;
            }
        }

        // Inside your renderProducts function loop:
        function renderProducts(products) {
            const tableBody = document.getElementById('product-table-body');
            tableBody.innerHTML = '';

            products.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                // Convert 1/0 from DB to checked attribute
                const isChecked = item.visible === 1 ? 'checked' : '';

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td class="text-left">${item.name}</td>
                    <td>${item.category}</td>
                    <td>${item.brand}</td>
                    <td>${item.quantity_total}</td>
                    <td>
                        <label class="switch">
                            <input type="checkbox" ${isChecked} 
                                onchange="toggleVisibility(${item.model_id}, this.checked, '${item.name}', '${item.brand}', '${item.category}')">
                            <span class="slider"></span>
                        </label>
                    </td>
                    <td>
                        <button class="icon-btn" onclick="editProduct(${item.model_id})">📝</button>
                    </td>
                    <td>
                        <button class="icon-btn" onclick="deleteProduct(${item.model_id}, '${item.name}')">🗑️</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Function to handle the API update
        async function toggleVisibility(id, isVisible, name, brand, category) {
            const status = isVisible ? 1 : 0;
            
            try {
                const response = await fetch(`/api/admin/edit-product/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        brand: brand,
                        category: category,
                        visible: status,
                        admin_id: 1 // Replace with actual admin session ID
                    })
                });

                const result = await response.json();

                if (result.error) {
                    alert("Failed to update visibility: " + result.message);
                    // Optional: refresh page to reset toggle state if it failed
                    fetchProducts(); 
                } else {
                    console.log(`Product ${id} visibility set to: ${status}`);
                }
            } catch (error) {
                console.error("Toggle Error:", error);
                alert("Network error while updating visibility.");
            }
        }

        function editProduct(id) {
            // Pass the ID via query string so the edit page knows which product to load
            window.location.href = `/admin/edit-product?id=${id}`;
        }

        async function deleteProduct(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

            try {
                const response = await fetch(`/api/admin/product-control/${id}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: CURRENT_ADMIN_ID })
                });

                const result = await response.json();

                if (result.error) {
                    // This will likely trigger if items are still linked to this model (Foreign Key error)
                    alert("Error: " + result.message);
                } else {
                    alert("Product deleted successfully.");
                    fetchProducts(); // Refresh list
                }
            } catch (error) {
                console.error("Delete Error:", error);
                alert("Failed to delete product.");
            }
        }
    </script>

</body>
</html>
