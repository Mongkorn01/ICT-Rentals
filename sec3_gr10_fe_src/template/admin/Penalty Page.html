<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-RENTALS - Overdue Student List</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        /* --- Global Navbar --- */
        .nav-links li.active { font-weight: 600; }
        .nav-links a {
            text-decoration: none;
            color: #333;
        }

        nav {
            display: flex;
            align-items: center;
            padding: 10px 40px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #fcfcfc;
        }
        .logo { height: 45px; margin-right: 40px; }
        .nav-links { display: flex; list-style: none; margin: 0; padding: 0; flex-grow: 1; }
        .nav-links li { margin: 0 20px; font-size: 18px; cursor: pointer; color: #333; }
        .dropdown::after {font-size: 10px; color: #888; }
        .nav-links li.active {
            font-weight: 600;
        }                
        .nav-right { display: flex; align-items: center; gap: 20px; }

        /* --- Content Container --- */
        .container {
            padding: 50px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 { 
            font-size: 28px; 
            margin-bottom: 30px; 
            text-align: center;
            font-weight: 600;
        }

        /* --- Data Table --- */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ddd;
        }

        th {
            background-color: #efefef;
            padding: 15px;
            text-align: center;
            color: #777;
            font-size: 14px;
            border: 1px solid #ddd;
            font-weight: 600;
        }

        td {
            padding: 15px;
            border: 1px solid #ddd;
            color: #666;
            text-align: center;
            vertical-align: middle;
            font-size: 15px;
        }

        .text-left { text-align: left; padding-left: 20px; }

        /* --- Status Pill --- */
        .status-overdue {
            background-color: #ff4d4d;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .status-overdue::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
        }

        /* --- Red Overdue Date --- */
        .overdue-date {
            color: #ff4d4d;
            font-weight: bold;
        }

        /* --- Action Icon --- */
        .detail-icon {
            background: none;
            border: none;
            font-size: 20px;
            color: #aaa;
            cursor: pointer;
        }

        /* GEMINI HELPER */
        .gemini-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
            z-index: 1000;
            transition: transform 0.2s;
        }

        .gemini-btn:hover {
            transform: scale(1.05);
        }

        .gemini-icon {
            margin-right: 8px;
            font-size: 18px;
        }
        .ai-modal {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            z-index: 1001;
        }

        .ai-header {
            background: #1a3a8a; /* Matches your logo blue */
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .ai-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .ai-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
        }

        #ai-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .ai-footer button {
            background: #7d97e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        /* GEMINI HELPER */
    </style>
</head>
<body>

    <nav>
        <img src="https://i.postimg.cc/N0Y1nx0g/mu-ict-logo.png" alt="ICT Rentals" class="logo">
        <ul class="nav-links" style="display: flex; align-items: center; list-style: none;">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            
            <li><a href="/admin/product-control">Product Control</a></li>

            <li><a href="/admin/penalty">Penalty Page</a></li>
            <li><a href="/admin/team">Team Page</a></li> 
        </ul>
        <div class="nav-right">
            <a href="/" style="text-decoration: none; color: inherit; cursor: pointer;">Log Out</a>
            <img src="https://i.postimg.cc/sgJMCVtT/Doorbell.png" style="height: 30px; cursor: pointer; margin-left: 15px;">
        </div>
    </nav>

    <main>
        <div class="container">
            <h1>Overdue student list</h1>

            <table>
                <thead>
                    <tr>
                        <th width="8%">No.</th>
                        <th width="18%">Equipment ID</th>
                        <th width="25%">User name</th>
                        <th width="18%">Status</th>
                        <th width="20%">Overdue date</th>
                        <th width="11%">Details</th>
                    </tr>
                </thead>
                <tbody id="penalty-table-body">
                    </tbody>
            </table>
        </div>
    </main>

    <!-- GEMINI HELPER -->
    <footer>
        <button class="gemini-btn" onclick="toggleAI()">
            <span class="gemini-icon">✨</span> Ask Gemini
        </button>

        <div id="ai-window" class="ai-modal" style="display: none;">
            <div class="ai-header">
                <span>✨ Gemini Assistant</span>
                <button onclick="toggleAI()" class="close-btn">&times;</button>
            </div>
            <div id="ai-response-area" class="ai-content">
                Hi! How can I help you navigate ICT-RENTALS?
            </div>
            <div class="ai-footer">
                <input type="text" id="ai-input" placeholder="Type your question...">
                <button onclick="sendToAI()">Send</button>
            </div>
        </div>
    </footer>


    <script>
        function toggleAI() {
            const win = document.getElementById('ai-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const prompt = input.value;
            if (!prompt) return;

            area.innerHTML = "<em>Thinking...</em>";
            input.value = ""; // Clear input

            try {
                const response = await fetch('/api/ai-assist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[Context: ${window.location.pathname}] ${prompt}` }),
                });
                
                const data = await response.json();
                area.innerHTML = data.success ? data.text : "Error: " + data.error;
            } catch (err) {
                area.innerHTML = "Failed to connect to AI.";
            }
        }

        /*api*/
        document.addEventListener('DOMContentLoaded', () => {
            fetchOverdueItems();
        });

        async function fetchOverdueItems() {
            const tableBody = document.getElementById('penalty-table-body');
            
            try {
                const response = await fetch('/api/admin/penalty');
                const result = await response.json();

                if (result.error) {
                    throw new Error(result.message);
                }

                renderTable(result.data);
            } catch (error) {
                console.error("Fetch error:", error);
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Failed to load overdue list.</td></tr>`;
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById('penalty-table-body');
            tableBody.innerHTML = ''; // Clear static content

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No overdue items found.</td></tr>`;
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                
                // Format the date (Assuming DD/MM/YYYY based on your static HTML)
                const dueDate = new Date(item.due_date);
                const formattedDate = dueDate.toLocaleDateString('en-GB'); // en-GB gives DD/MM/YYYY

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.serial_number}</td>
                    <td class="text-left">${item.student_name}</td>
                    <td><span class="status-overdue">Overdue</span></td>
                    <td class="overdue-date">${formattedDate}</td>
                    <td>
                        <button class="detail-icon" onclick="viewPenaltyDetails(${item.rental_item_id})">⇪</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function viewPenaltyDetails(rentalItemId) {
            // Navigate to a details page or open a modal
            // Example: window.location.href = `/admin/penalty-details?id=${rentalItemId}`;
            console.log("Viewing details for Rental Item ID:", rentalItemId);
        }
    </script>

</body>
</html>
