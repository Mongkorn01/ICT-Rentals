<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===== Meta & Page Setup ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-RENTALS - Edit Product</title>

    <!-- ===== Styles (Layout, Components, UI) ===== -->
    <style>
        /* ===== Base Styles ===== */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }

        /* ===== Navbar ===== */
        .nav-links li.active { font-weight: 600; }
        .nav-links a {
            text-decoration: none;
            color: #333;
        }

        nav {
            display: flex;
            align-items: center;
            padding: 10px 40px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
        }
        .logo { height: 45px; margin-right: 40px; }
        .nav-links { display: flex; list-style: none; margin: 0; padding: 0; flex-grow: 1; }
        .nav-links li { margin: 0 20px; font-size: 18px; cursor: pointer; color: #444; }
        .nav-links li.active { font-weight: 500; background-color: #f8f8f8; padding: 10px 15px; margin: -10px 5px; }
        .dropdown::after {font-size: 10px; color: #888; }
        .nav-links li.active { font-weight: 600; }                
        .nav-right { display: flex; align-items: center; gap: 20px; }

        /* ===== Main Layout ===== */
        .container {
            padding: 30px 10%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 5%;
            top: 40px;
            width: 45px;
            height: 45px;
            background: #e8e8e8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            font-size: 20px;
            color: #888;
        }

        h1 { text-align: center; font-size: 28px; margin-bottom: 30px; }

        /* ===== Form Card ===== */
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 40px 60px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-row label {
            width: 200px;
            font-size: 18px;
            color: #333;
        }

        .form-row input, .form-row select {
            flex-grow: 1;
            max-width: 500px;
            padding: 10px 15px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 16px;
        }

        /* ===== Image Preview ===== */
        .pic-container {
            display: flex;
            gap: 20px;
        }

        .pic-box {
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fff;
            position: relative;
        }

        .pic-box.placeholder {
            background-color: #d9d9d9;
            font-size: 60px;
            color: #999;
            cursor: pointer;
        }

        .pic-box img { max-width: 90%; max-height: 90%; }

        /* ===== Editor ===== */
        .editor-container {
            border: 1px solid #ccc;
            border-radius: 8px;
            flex-grow: 1;
            max-width: 600px;
            overflow: hidden;
        }

        .editor-toolbar {
            background: #fcfcfc;
            border-bottom: 1px solid #ddd;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .toolbar-group {
            display: flex;
            border-right: 1px solid #ddd;
            padding-right: 5px;
            margin-right: 5px;
        }

        .editor-content {
            height: 350px;
            padding: 15px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.4;
            background: #fff;
        }

        .editor-footer {
            background: #f1f1f1;
            padding: 2px 10px;
            font-size: 11px;
            color: #777;
            text-align: right;
            border-top: 1px solid #ddd;
        }

        /* ===== Form Footer ===== */
        .form-footer {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
        }

        /* ===== Toggle Switch ===== */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #4CAF50; }
        input:checked + .slider:before { transform: translateX(26px); }

        /* ===== Buttons ===== */
        .action-group {
            display: flex;
            gap: 20px;
        }

        .btn {
            border: none;
            padding: 10px 50px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-save {
            background-color: #d9d9d9;
            color: #333;
        }

        .btn-delete {
            background-color: #fff1f1;
            color: #d9534f;
            border: 1px solid #d9534f;
        }

        /* ===== Gemini Assistant UI ===== */
        .gemini-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
            z-index: 1000;
            transition: transform 0.2s;
        }

        .gemini-btn:hover { transform: scale(1.05); }

        .gemini-icon {
            margin-right: 8px;
            font-size: 18px;
        }

        .ai-modal {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            z-index: 1001;
        }

        .ai-header {
            background: #1a3a8a;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .ai-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
        }

        .ai-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
        }

        #ai-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .ai-footer button {
            background: #7d97e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- ===== Navigation Bar ===== -->
    <nav>
        <img src="https://i.postimg.cc/N0Y1nx0g/mu-ict-logo.png" alt="ICT Rentals" class="logo">
        <ul class="nav-links" style="display: flex; align-items: center; list-style: none;">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/product-control">Product Control</a></li>
            <li><a href="/admin/penalty">Penalty Page</a></li>
            <li><a href="/admin/team">Team Page</a></li> 
        </ul>
        <div class="nav-right">
            <a href="/">Log Out</a>
            <img src="https://i.postimg.cc/sgJMCVtT/Doorbell.png" style="height: 30px; cursor: pointer; margin-left: 15px;">
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <main>
        <div class="container">
            <button class="back-btn" onclick="window.location.href='/admin/product-control'">❮</button>
            <h1>Edit Product</h1>

            <!-- ===== Product Form ===== -->
            <div class="form-card">
                <!-- Form Fields -->
                <div class="form-row">
                    <label>Category :</label>
                    <select id="editCategory">
                        <option value="Computing">Computing</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Camera">Camera</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>Brand :</label>
                    <input type="text" id="editBrand">
                </div>

                <div class="form-row">
                    <label>Product name :</label>
                    <input type="text" id="editName">
                </div>

                <div class="form-row">
                    <label>Product Image URL :</label>
                    <input type="text" id="editImgUrl" oninput="updatePreview(this.value)">
                </div>

                <!-- Image Preview -->
                <div class="form-row" style="align-items: flex-start;">
                    <label>Preview :</label>
                    <div class="pic-container">
                        <div class="pic-box">
                            <img id="editPreviewImg" src="" alt="Preview" style="max-width: 100%;">
                        </div>
                    </div>
                </div>

                <!-- Specifications -->
                <div class="form-row" style="align-items: flex-start;">
                    <label>Product Specification :</label>
                    <div class="editor-container">
                        <textarea id="editSpecs" style="width: 100%; height: 150px; border: none; padding: 10px; resize: vertical;"></textarea>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="form-footer">
                    <div class="toggle-row">
                        <span>Open visible :</span>
                        <label class="switch">
                            <input type="checkbox" id="editVisible" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="action-group">
                        <button class="btn btn-delete" id="deleteProductBtn">Delete</button>
                        <button class="btn btn-save" id="saveEditBtn">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== Gemini Assistant ===== -->
    <footer>
        <button class="gemini-btn" onclick="toggleAI()">
            <span class="gemini-icon">✨</span> Ask Gemini
        </button>

        <div id="ai-window" class="ai-modal" style="display: none;">
            <div class="ai-header">
                <span>✨ Gemini Assistant</span>
                <button onclick="toggleAI()" class="close-btn">&times;</button>
            </div>
            <div id="ai-response-area" class="ai-content">
                Hi! How can I help you navigate ICT-RENTALS?
            </div>
            <div class="ai-footer">
                <input type="text" id="ai-input" placeholder="Type your question...">
                <button onclick="sendToAI()">Send</button>
            </div>
        </div>
    </footer>

    <!-- ===== Script (Logic & API Handling) ===== -->
    <script>
        /* ===== AI Assistant ===== */
        function toggleAI() {
            const win = document.getElementById('ai-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const prompt = input.value;
            if (!prompt) return;

            area.innerHTML = "<em>Thinking...</em>";
            input.value = "";

            try {
                const response = await fetch('/api/ai-assist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[Context: ${window.location.pathname}] ${prompt}` }),
                });
                
                const data = await response.json();
                area.innerHTML = data.success ? data.text : "Error: " + data.error;
            } catch (err) {
                area.innerHTML = "Failed to connect to AI.";
            }
        }

        /* ===== Initialization ===== */
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const CURRENT_ADMIN_ID = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!productId) {
                alert("No product ID found");
                return;
            }
            await loadProductData();
        });

        /* ===== Image Preview Handler ===== */
        function updatePreview(url) {
            const preview = document.getElementById('editPreviewImg');
            
            preview.onerror = function() {
                this.onerror = null; 
                this.src = 'https://placehold.co/150?text=Error'; 
                console.error("The image at " + url + " could not be loaded.");
            };

            if (!url || url === "null") {
                preview.src = 'https://placehold.co/150?text=No+URL';
            } else {
                preview.src = url;
            }
        }

        /* ===== Load Product Data ===== */
        async function loadProductData() {
            try {
                const response = await fetch('/api/admin/product-control');
                const result = await response.json();
                
                const product = result.data.find(p => p.model_id == productId);

                if (product) {
                    document.getElementById('editName').value = product.name;
                    document.getElementById('editBrand').value = product.brand;
                    document.getElementById('editCategory').value = product.category;
                    document.getElementById('editImgUrl').value = product.img_url || '';
                    document.getElementById('editSpecs').value = product.specs || '';
                    updatePreview(product.img_url);
                }
            } catch (error) {
                console.error("Error loading product:", error);
            }
        }

        /* ===== Save Changes ===== */
        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const updatedData = {
                name: document.getElementById('editName').value,
                brand: document.getElementById('editBrand').value,
                category: document.getElementById('editCategory').value,
                img_url: document.getElementById('editImgUrl').value,
                specs: document.getElementById('editSpecs').value,
                details: "", 
                admin_id: CURRENT_ADMIN_ID
            };

            try {
                const response = await fetch(`/api/admin/edit-product/${productId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                const result = await response.json();
                if (result.error) throw new Error(result.message);

                alert("Update successful!");
                window.location.href = '/admin/product-control';
            } catch (error) {
                alert("Failed to update: " + error.message);
            }
        });

        /* ===== Delete Product ===== */
        document.getElementById('deleteProductBtn').addEventListener('click', async () => {
            if (!confirm("Are you sure you want to delete this product?")) return;

            try {
                const response = await fetch(`/api/admin/product-control/${productId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admin_id: CURRENT_ADMIN_ID })
                });
                window.location.href = '/admin/product-control';
            } catch (error) {
                console.error("Delete error:", error);
            }
        });
    </script>

</body>
</html>
