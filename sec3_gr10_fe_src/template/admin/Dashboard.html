<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ===== META & TITLE ===== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-RENTALS Admin Dashboard</title>

    <!-- ===== STYLES ===== -->
    <style>
        /* --- Global Layout --- */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        /* --- Navbar Styles --- */
        .nav-links li.active { font-weight: 600; }
        .nav-links a {
            text-decoration: none;
            color: #333;
        }

        nav {
            display: flex;
            align-items: center;
            padding: 10px 40px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #fcfcfc;
        }

        .logo {
            height: 50px;
            margin-right: 40px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            flex-grow: 1;
        }

        .nav-links li {
            margin: 0 20px;
            font-size: 18px;
            cursor: pointer;
            color: #222;
        }

        .nav-links li.active {
            background-color: #f5f5f5;
            padding: 10px 20px;
            margin: -10px 0;
            font-weight: 500;
        }

        .dropdown::after {
            font-size: 12px;
            color: #666;
        }

        .nav-right {
            display: flex;
            align-items: center;
        }

        .notification-bell {
            font-size: 24px;
            color: #bbb;
            margin-left: 20px;
            cursor: pointer;
        }

        /* --- Main Content --- */
        .container {
            padding: 40px 10%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* --- Table Styles --- */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
            padding: 15px;
            text-align: left;
            color: #888;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        td {
            padding: 15px;
            border: 1px solid #ddd;
            color: #666;
            vertical-align: middle;
        }

        /* --- Status Badges --- */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            min-width: 100px;
        }

        .badge::before {
            content: '●';
            margin-right: 8px;
            font-size: 12px;
        }

        .status-borrowed { background-color: #2ecc71; }
        .status-returned { background-color: #d4d800; }
        .status-overdue { background-color: #f34336; }
        .status-pending { background-color: #7d97e2; }

        /* --- Table Interaction --- */
        .details-icon {
            font-size: 20px;
            color: #999;
            cursor: pointer;
            text-align: center;
            display: block;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        /* --- AI Assistant Button --- */
        .gemini-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #4285f4, #9b72cb);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
            z-index: 1000;
            transition: transform 0.2s;
        }

        .gemini-btn:hover {
            transform: scale(1.05);
        }

        .gemini-icon {
            margin-right: 8px;
            font-size: 18px;
        }

        /* --- AI Assistant Modal --- */
        .ai-modal {
            position: fixed;
            bottom: 80px;
            left: 20px;
            width: 350px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            z-index: 1001;
        }

        .ai-header {
            background: #1a3a8a;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .ai-content {
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .ai-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
        }

        #ai-input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }

        .ai-footer button {
            background: #7d97e2;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- ===== NAVIGATION BAR ===== -->
    <nav>
        <img src="https://i.postimg.cc/N0Y1nx0g/mu-ict-logo.png" alt="ICT Rentals" class="logo">
        <ul class="nav-links" style="display: flex; align-items: center; list-style: none;">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/product-control">Product Control</a></li>
            <li><a href="/admin/penalty">Penalty Page</a></li>
            <li><a href="/admin/team">Team Page</a></li> 
        </ul>
        <div class="nav-right">
            <a href="/" style="text-decoration: none; color: inherit; cursor: pointer;">Log Out</a>
            <img src="https://i.postimg.cc/sgJMCVtT/Doorbell.png" style="height: 30px; cursor: pointer; margin-left: 15px;">
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <div class="container">
            <!-- --- Header & Filter --- -->
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>Dashboard</h1>
                <select id="statusFilter" onchange="fetchDashboardData()" style="padding: 5px; border-radius: 4px;">
                    <option value="">All Statuses</option>
                    <option value="Borrowed">Borrowed</option>
                    <option value="Returned">Returned</option>
                    <option value="Overdue">Overdue</option>
                    <option value="Pending">Pending</option>
                </select>
            </div>

            <!-- --- Data Table --- -->
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px;">No.</th>
                        <th>Equipment ID</th>
                        <th>User name</th>
                        <th>Status</th>
                        <th>Rented date</th>
                        <th style="width: 80px;">Details</th>
                    </tr>
                </thead>
                <tbody id="dashboard-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- ===== AI ASSISTANT UI ===== -->
    <footer>
        <button class="gemini-btn" onclick="toggleAI()">
            <span class="gemini-icon">✨</span> Ask Gemini
        </button>

        <div id="ai-window" class="ai-modal" style="display: none;">
            <div class="ai-header">
                <span>✨ Gemini Assistant</span>
                <button onclick="toggleAI()" class="close-btn">&times;</button>
            </div>
            <div id="ai-response-area" class="ai-content">
                Hi! How can I help you navigate ICT-RENTALS?
            </div>
            <div class="ai-footer">
                <input type="text" id="ai-input" placeholder="Type your question...">
                <button onclick="sendToAI()">Send</button>
            </div>
        </div>
    </footer>

    <!-- ===== JAVASCRIPT LOGIC ===== -->
    <script>
        /* --- AI Window Controls --- */
        function toggleAI() {
            const win = document.getElementById('ai-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const prompt = input.value;
            if (!prompt) return;

            area.innerHTML = "<em>Thinking...</em>";
            input.value = "";

            try {
                const response = await fetch('/api/ai-assist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[Context: ${window.location.pathname}] ${prompt}` }),
                });
                
                const data = await response.json();
                area.innerHTML = data.success ? data.text : "Error: " + data.error;
            } catch (err) {
                area.innerHTML = "Failed to connect to AI.";
            }
        }

        /* --- Navbar Dropdown Logic --- */
        function toggleManagement(event) {
            event.stopPropagation();
            
            const menu = document.getElementById('mgmt-menu');
            const arrow = document.getElementById('mgmt-arrow');
            const isOpen = menu.style.display === 'block';

            menu.style.display = isOpen ? 'none' : 'block';
            arrow.textContent = isOpen ? '▼' : '▲';
        }

        window.onclick = function(event) {
            const menu = document.getElementById('mgmt-menu');
            const arrow = document.getElementById('mgmt-arrow');
            
            if (menu.style.display === 'block') {
                menu.style.display = 'none';
                arrow.textContent = '▼';
            }
        };

        /* --- API Fetch Logic --- */
        async function fetchDashboardData() {
            const tableBody = document.getElementById('dashboard-table-body');
            const status = document.getElementById('statusFilter').value;
            
            const url = status ? `/api/admin/dashboard?status=${status}` : '/api/admin/dashboard';

            try {
                const response = await fetch(url);
                const result = await response.json();

                if (result.error) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="color: red;">Error: ${result.message}</td></tr>`;
                    return;
                }

                renderTable(result.data);
            } catch (error) {
                console.error("Fetch error:", error);
                tableBody.innerHTML = `<tr><td colspan="6" style="color: red;">Failed to connect to server.</td></tr>`;
            }
        }

        /* --- Table Rendering --- */
        function renderTable(data) {
            const tableBody = document.getElementById('dashboard-table-body');
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center;">No records found.</td></tr>`;
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                
                const borrowDate = new Date(row.borrow_date).toLocaleDateString('en-GB');
                const statusClass = `status-${row.status.toLowerCase()}`;

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${row.serial_number || row.item_id}</td>
                    <td>${row.student_name}</td>
                    <td><span class="badge ${statusClass}">${row.status}</span></td>
                    <td>${borrowDate}</td>
                    <td>
                        <span class="details-icon" title="View Details" onclick="viewDetails(${row.rental_item_id})">⎋</span>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        /* --- Row Interaction --- */
        function viewDetails(id) {
            console.log("Details for Rental ID:", id);
        }

        /* --- Initial Page Load --- */
        document.addEventListener('DOMContentLoaded', fetchDashboardData);
    </script>
</body>
</html>
