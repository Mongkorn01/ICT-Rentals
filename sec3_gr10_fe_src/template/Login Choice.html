<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-RENTALS Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* --- Global Layout --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Login Card --- */
        .login-card {
            background-color: #ffffff;
            width: 450px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* --- Logo Section --- */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* --- Divider --- */
        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 25px 0;
        }

        /* --- Headings --- */
        h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* --- Buttons --- */
        .btn {
            margin-bottom: 15px;
        }

        /* --- Footer Text --- */
        .footer-text h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }

        .footer-text p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <!-- ===== MAIN LOGIN SECTION ===== -->
    <main>
        <div class="login-card">

            <!-- --- Logo --- -->
            <div class="logo-container">
                <img src="https://i.postimg.cc/BvYTBQ6S/long-logo.png" alt="ICT Rentals" style="height: 50px;">
            </div>

            <hr>

            <!-- --- Login Options --- -->
            <h2>Log in using your account on:</h2>

            <a href="login-student" class="btn btn-mahidol">
                <span class="icon">👤</span> Mahidol Account Login
            </a>

            <a href="login-admin" class="btn btn-admin">
                Admin Account Login
            </a>

            <hr>

            <!-- --- Help / Info Section --- -->
            <div class="footer-text">
                <h3>Is this your first time here?</h3>
                <p><a href="#" class="blue-link">Use your MU internet account for login</a></p>
                <p class="example-text">
                    <strong>Ex.</strong> u6388xxx (for student),<br>
                    pxxxx.xxx (for teacher)
                </p>
            </div>

        </div>  
    </main>
    
    <!-- ===== AI ASSISTANT UI ===== -->
    <footer>
        <button class="gemini-btn" onclick="toggleAI()">
            <span class="gemini-icon">✨</span> Ask Gemini
        </button>

        <div id="ai-window" class="ai-modal" style="display: none;">
            <div class="ai-header">
                <span>✨ Gemini Assistant</span>
                <button onclick="toggleAI()" class="close-btn">&times;</button>
            </div>
            <div id="ai-response-area" class="ai-content">
                Hi! How can I help you navigate ICT-RENTALS?
            </div>
            <div class="ai-footer">
                <input type="text" id="ai-input" placeholder="Type your question...">
                <button onclick="sendToAI()">Send</button>
            </div>
        </div>
    </footer>
    
    <!-- ===== JAVASCRIPT LOGIC ===== -->
    <script>
        /* --- AI Controls --- */
        function toggleAI() {
            const win = document.getElementById('ai-window');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendToAI() {
            const input = document.getElementById('ai-input');
            const area = document.getElementById('ai-response-area');
            const prompt = input.value;
            if (!prompt) return;

            area.innerHTML = "<em>Thinking...</em>";
            input.value = "";

            try {
                const response = await fetch('/api/ai-assist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: `[Context: ${window.location.pathname}] ${prompt}` }),
                });
                
                const data = await response.json();
                area.innerHTML = data.success ? data.text : "Error: " + data.error;
            } catch (err) {
                area.innerHTML = "Failed to connect to AI.";
            }
        }
    </script>

</body>
</html>
